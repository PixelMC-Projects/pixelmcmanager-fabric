plugins {
    id "fabric-loom" version "1.7.4"
    id "maven-publish"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven { url = uri("https://maven.aliyun.com/repository/public") }
    maven { url = uri("https://maven.aliyun.com/repository/central") }
    maven { name = "Fabric"; url = uri("https://maven.fabricmc.net/") }
    maven { name = "Mojang"; url = uri("https://libraries.minecraft.net/") }
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    withSourcesJar()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.loader_version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand(
                "version": project.version,
                "minecraft_version": project.minecraft_version,
                "loader_version": project.loader_version
        )
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release = 21
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }
}

// Preserve the project's license and original-author notice in every published JAR.
tasks.withType(Jar).configureEach {
    from(rootProject.file('LICENSE')) { into 'META-INF/pixelmc' }
    from(rootProject.file('NOTICE')) { into 'META-INF/pixelmc' }
    from(rootProject.file('LICENSE-EXCEPTION.md')) { into 'META-INF/pixelmc' }
}

// Behavioral checks run as ordinary Java programs; no game instance is started.
sourceSets {
    restartChecks {
        compileClasspath = sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath = output + compileClasspath
    }
}
['restartLogicTest': 'com.pixelmc.pixelmcmanager.restart.RestartLogicTest',
 'bridgeLogicTest': 'com.pixelmc.pixelmcmanager.bridge.BridgeLogicTest',
 'bridgeAdmissionTest': 'com.pixelmc.pixelmcmanager.bridge.BridgeAdmissionTest',
 'lifecycleShutdownTest': 'com.pixelmc.pixelmcmanager.compat.LifecycleShutdownTest',
 'textParityTest': 'com.pixelmc.pixelmcmanager.text.TextParityTest'].each { taskName, entry ->
    tasks.register(taskName, JavaExec) {
        dependsOn restartChecksClasses
        classpath = sourceSets.restartChecks.runtimeClasspath
        mainClass = entry
    }
    tasks.named('check').configure { dependsOn taskName }
}
